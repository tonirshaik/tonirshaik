name: Auto version bump

on:
  push:
    branches: [main]
    paths-ignore:
      - version.json
      - VERSIONING.md
      - README.md
      - sitemap-images.xml

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: bump')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Calculate and write next version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const before=process.env.BEFORE||'',after=process.env.AFTER;
          let log='';
          try{
            const cmd=/^0*$/.test(before)?'git log -1 --format=%B%n----':'git log '+before+'..'+after+' --format=%B%n----';
            log=cp.execSync(cmd).toString();
          }catch(e){}
          let level='patch';
          if(/^[a-z]+(\([^)]*\))?!:/im.test(log)||/BREAKING CHANGE/.test(log)||/^major:/im.test(log)){level='major';}
          else if(/^(feat|feature|minor)(\([^)]*\))?:/im.test(log)){level='minor';}
          const data=JSON.parse(fs.readFileSync('version.json','utf8'));
          const m=/^(\d+)\.(\d+)\.(\d+)$/.exec(data.version||'');
          if(!m)throw new Error('version.json must contain a version like 1.0.0');
          let [a,b,c]=m.slice(1).map(Number);
          if(level==='major'){a++;b=0;c=0;}
          else if(level==='minor'){b++;c=0;}
          else{c++;}
          data.version=a+'.'+b+'.'+c;
          data.release=level==='major'?'Major release':(level==='minor'?'Feature release':'Bug fix / maintenance release');
          data.updatedAt=new Date().toISOString();
          fs.writeFileSync('version.json',JSON.stringify(data,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+data.version+'\n');
          NODE

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump gallery version to ${{ steps.version.outputs.version }}"
          git pull --rebase
          git push

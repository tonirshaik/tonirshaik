# .github/workflows/warm-cache.yml
#
# এই ফাইলটা রিপোর .github/workflows/ ফোল্ডারে রাখুন।
# এটা warm-cache.js চালিয়ে Cloudflare প্রক্সির cache আগে থেকেই গরম করে রাখবে —
# তাই যখন সত্যিকারের visitor আসবে, ছবি already cached থাকবে।
#
# চলবে:
#  - প্রতি ৩০ মিনিটে (cron) — নতুন আপলোড হওয়া ছবি বেশিক্ষণ cold না থাকার জন্য
#  - main branch-এ push হলে (যদি ছবির লিংক ফাইল আপডেট হয়)
#  - ম্যানুয়ালি "Run workflow" বাটন থেকেও (workflow_dispatch)

name: Warm image cache

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'Tonir photo Link.txt'
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Warm Cloudflare image cache
        run: node warm-cache.js
